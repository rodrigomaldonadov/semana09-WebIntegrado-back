# H2 (in-memory) configuration for development profile
spring.datasource.url=jdbc:h2:mem:marketdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop keeps the database fresh on restart; change to 'update' if you need persistence across runs
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Enable H2 console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
